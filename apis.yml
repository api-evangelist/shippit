aid: shippit
url: https://raw.githubusercontent.com/api-evangelist/shippit/refs/heads/main/apis.yml
name: Shippit
kind: company
description: Shippit is an Australian multi-carrier shipping and fulfillment platform
  for retailers and e-commerce merchants across Australia, New Zealand, and Southeast
  Asia. Its REST API (v3) lets merchants request live carrier quotes, create and
  cancel orders, book consignments with carriers, retrieve A6 shipping labels and
  pick slips, and track parcels via pull requests or push webhooks. Authentication
  is a per-merchant API key passed as an HTTP Bearer token, with a staging sandbox
  and a production environment.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Shipping
- Logistics
- Fulfillment
- Australia
- APAC
- Multi-Carrier
- Labels
- Tracking
- Parcels
- E-commerce Logistics
- SaaS
