principles:
- name: Visibility
  description: Track per-delivery charges by carrier and monthly order volume against the subscribed order band.
- name: Allocation
  description: Attribute delivery costs to store/channel/team so shipping spend maps to internal cost centers.
- name: Optimization
  description: Use multi-carrier quotes to select cost-effective services, right-size the subscription order band to actual volume, and apply transit protection selectively.
- name: Accountability
  description: Review monthly volume against the subscription band and renegotiate enterprise rates as volume grows.
