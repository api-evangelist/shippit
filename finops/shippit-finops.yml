meters:
- name: subscription
  description: Monthly SaaS subscription scaled by order-volume band.
  unit: months
  aggregation: sum
  dimensions:
  - account
  - plan
- name: deliveries
  description: Per-delivery carrier charges, scaling with shipment volume.
  unit: deliveries
  aggregation: sum
  dimensions:
  - account
  - carrier
- name: transit_protection
  description: Optional transit protection, charged as a percentage of order retail value.
  unit: orders
  aggregation: sum
  dimensions:
