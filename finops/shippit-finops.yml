description: >-
  FinOps view of Shippit spend. Shippit cost has two main components: a monthly
  SaaS subscription scaled by order-volume band, and per-delivery carrier
  charges (advertised "from AUD 1 per delivery ex GST"), plus optional add-ons
  such as bring-your-own-carrier booking fees and transit protection (a
  percentage of order retail value). API usage itself is not separately metered;
  it is included in the subscription. Enterprise agreements carry negotiated
  rates. Per-unit rates are region-specific and were not reconciled here.
notes: >-
  Verify current subscription bands, per-delivery rates, and add-on fees on the
  Shippit pricing page. Dominant variable cost is per-delivery carrier charges,
  which scale directly with shipment volume.
